name: campussave_mobile
description: Application mobile CampusSave (Flutter) – anti-gaspillage ESSECT
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  http: ^1.2.2
  http_parser: ^4.0.2
  # [MARYEM] nouvelles fonctionnalités : photo (offres, logo, profil), Campus Radar (carte + position)
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  url_launcher: ^6.3.1
  mobile_scanner: ^5.2.3
  video_player: ^2.9.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # [MARYEM] Design beige : animation des 4 univers (boissons, coffee, burger, cheesecake) + polices intégrées
  assets:
    - assets/hero.mp4
    - assets/hero-poster.jpg

  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
